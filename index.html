<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAD RP · Normativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="general">
<header class="bar sticky top-0 z-50">
 <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3">
  <img src="images/logo.jpg" alt="MAD RP" class="logo w-11 h-11 rounded-full object-cover">
  <span class="hd font-black text-lg hidden sm:block">MAD RP</span>
  <nav id="tabs" role="tablist" aria-label="Normativas" class="flex gap-1 overflow-x-auto ml-1 flex-1"></nav>
  <input id="q" type="search" placeholder="Buscar una norma" aria-label="Buscar una norma" class="glass px-3 py-1.5 text-sm w-40 lg:w-56 bg-transparent outline-none focus:w-64 transition-all">
 </div>
</header>
<section class="hero">
 <img src="images/hero.jpg" alt="MAD RP: ciudad bajo tormenta roja">
 <div class="t"><div class="max-w-6xl mx-auto px-4">
  <h1 class="hd font-black glow text-4xl sm:text-6xl leading-none">Bienvenido a<br>una nueva historia</h1>
  <p id="sub" class="mt-3 text-base sm:text-lg max-w-xl" style="color:#d8cdd0"></p>
 </div></div>
</section>
<main class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-[230px_1fr] gap-8">
 <aside class="hidden lg:block"><nav id="idx" class="idx sticky top-24" aria-label="Secciones"></nav></aside>
 <div id="out" class="grid gap-6 min-w-0"></div>
</main>
<footer class="text-center text-sm py-10" style="color:var(--mu)">MAD RP · Reglamento general · Tu historia comienza aquí</footer>
<script src="js/app.js"></script>
</body>
</html>
